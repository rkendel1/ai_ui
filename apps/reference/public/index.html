<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI UI Reference — Full Stack Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 900px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 90vh;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .header h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
      }

      .mode-indicator {
        display: inline-block;
        background: rgba(255, 255, 255, 0.2);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        margin-top: 12px;
      }

      .content {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #e5e7eb;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .message {
        display: flex;
        gap: 12px;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        justify-content: flex-end;
      }

      .message-content {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 12px;
        word-wrap: break-word;
      }

      .message.user .message-content {
        background: #667eea;
        color: white;
      }

      .message.assistant .message-content {
        background: #f3f4f6;
        color: #1f2937;
      }

      .artifact {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 16px;
        margin-top: 8px;
      }

      .artifact-title {
        font-weight: 600;
        font-size: 14px;
        color: #667eea;
        margin-bottom: 8px;
      }

      .artifact-content {
        font-size: 13px;
        color: #6b7280;
        font-family: "Monaco", "Menlo", monospace;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 200px;
        overflow-y: auto;
      }

      .customer-card {
        background: white;
        border: 2px solid #667eea;
        border-radius: 8px;
        padding: 16px;
        max-width: 300px;
      }

      .customer-card h3 {
        color: #667eea;
        margin-bottom: 12px;
        font-size: 16px;
      }

      .customer-field {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #e5e7eb;
        font-size: 13px;
      }

      .customer-field label {
        font-weight: 600;
        color: #6b7280;
      }

      .customer-field value {
        color: #1f2937;
      }

      .tool-call {
        background: #fef3c7;
        border-left: 4px solid #f59e0b;
        padding: 12px;
        border-radius: 4px;
        margin: 8px 0;
        font-size: 13px;
      }

      .status {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        margin-left: 8px;
      }

      .status.running {
        background: #dbeafe;
        color: #1e40af;
      }

      .status.completed {
        background: #dcfce7;
        color: #166534;
      }

      .status.approval {
        background: #fef3c7;
        color: #b45309;
      }

      .input-area {
        border-top: 1px solid #e5e7eb;
        padding: 16px 24px;
        background: #f9fafb;
        display: flex;
        gap: 8px;
      }

      .input-area input {
        flex: 1;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
      }

      .input-area input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .input-area button {
        padding: 12px 24px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
      }

      .input-area button:hover {
        background: #5568d3;
      }

      .input-area button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }

      .sidebar {
        width: 250px;
        background: #f9fafb;
        border-left: 1px solid #e5e7eb;
        padding: 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .sidebar-section h3 {
        font-size: 12px;
        font-weight: 700;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
      }

      .sidebar-item {
        font-size: 13px;
        padding: 8px;
        background: white;
        border-radius: 6px;
        color: #6b7280;
        word-break: break-word;
        border: 1px solid #e5e7eb;
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #e5e7eb;
        border-top-color: #667eea;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #6b7280;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🧠 AI UI Reference</h1>
        <p>Full-stack end-to-end demonstration</p>
        <div class="mode-indicator" id="modeIndicator">🔮 Mock Provider</div>
      </div>

      <div class="content">
        <div class="chat-area">
          <div class="messages" id="messages"></div>

          <div class="input-area">
            <input
              type="text"
              id="messageInput"
              placeholder="Try: 'Get weather in San Francisco' or 'Customer details for C001'"
              autocomplete="off"
            />
            <button id="sendBtn" onclick="sendMessage()">Send</button>
          </div>
        </div>

        <div class="sidebar">
          <div class="sidebar-section">
            <h3>Protocol Events</h3>
            <div class="sidebar-item" id="eventLog">Ready...</div>
          </div>

          <div class="sidebar-section">
            <h3>Available Tools</h3>
            <div class="sidebar-item">
              <strong>get_weather</strong><br />
              <small>Get current weather</small>
            </div>
            <div class="sidebar-item">
              <strong>get_customer</strong><br />
              <small>Get customer details</small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      let session = null;
      const eventLogs = [];

      async function initSession() {
        const response = await fetch("/health");
        const health = await response.json();
        const modeEl = document.getElementById("modeIndicator");
        if (health.mode === "mock") {
          modeEl.textContent = "🔮 Mock Provider (Zero-Key Mode)";
        } else {
          modeEl.textContent = "🔑 Real Provider";
        }
      }

      function addEventLog(eventType) {
        eventLogs.push(eventType);
        const logEl = document.getElementById("eventLog");
        logEl.innerHTML = eventLogs.slice(-5).join("<br/>");
      }

      function renderCustomer(customer) {
        return `
          <div class="customer-card">
            <h3>👤 ${customer.name}</h3>
            <div class="customer-field">
              <label>ID:</label>
              <value>${customer.id}</value>
            </div>
            <div class="customer-field">
              <label>Email:</label>
              <value>${customer.email}</value>
            </div>
            <div class="customer-field">
              <label>Status:</label>
              <value><strong>${customer.status}</strong></value>
            </div>
            <div class="customer-field">
              <label>Joined:</label>
              <value>${customer.joinedDate}</value>
            </div>
          </div>
        `;
      }

      function renderArtifact(artifact) {
        if (artifact.type === "customer") {
          return renderCustomer(artifact.content);
        }

        return `
          <div class="artifact">
            <div class="artifact-title">${artifact.title}</div>
            <div class="artifact-content">${JSON.stringify(artifact.content, null, 2)}</div>
          </div>
        `;
      }

      async function sendMessage() {
        const input = document.getElementById("messageInput");
        const message = input.value.trim();

        if (!message) return;

        const messagesEl = document.getElementById("messages");

        // Add user message
        const userMsgEl = document.createElement("div");
        userMsgEl.className = "message user";
        userMsgEl.innerHTML = `<div class="message-content">${escapeHtml(message)}</div>`;
        messagesEl.appendChild(userMsgEl);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        input.value = "";
        document.getElementById("sendBtn").disabled = true;

        // Send to server
        const response = await fetch("/api/ai", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            messages: [{ role: "user", content: message }],
            tools: ["get_weather", "get_customer"]
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let assistantMsgEl = null;
        let assistantContent = "";

        try {
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const text = decoder.decode(value, { stream: true });
            const lines = text.split("\n").filter((l) => l.trim());

            for (const line of lines) {
              try {
                const event = JSON.parse(line);
                addEventLog(event.type);

                switch (event.type) {
                  case "message.started":
                    assistantMsgEl = document.createElement("div");
                    assistantMsgEl.className = "message assistant";
                    assistantMsgEl.innerHTML =
                      '<div class="message-content"></div>';
                    messagesEl.appendChild(assistantMsgEl);
                    break;

                  case "text.delta":
                    if (assistantMsgEl) {
                      const contentEl = assistantMsgEl.querySelector(
                        ".message-content"
                      );
                      assistantContent += event.text;
                      contentEl.textContent = assistantContent;
                      messagesEl.scrollTop = messagesEl.scrollHeight;
                    }
                    break;

                  case "tool.call.started":
                    if (assistantMsgEl) {
                      const contentEl = assistantMsgEl.querySelector(
                        ".message-content"
                      );
                      const toolEl = document.createElement("div");
                      toolEl.className = "tool-call";
                      toolEl.innerHTML = `🔧 ${event.name}<span class="status running">Running</span>`;
                      contentEl.appendChild(toolEl);
                    }
                    break;

                  case "artifact.created":
                    if (assistantMsgEl) {
                      const contentEl = assistantMsgEl.querySelector(
                        ".message-content"
                      );
                      const artifactEl = document.createElement("div");
                      artifactEl.innerHTML = renderArtifact(event.artifact);
                      contentEl.appendChild(artifactEl);
                      messagesEl.scrollTop = messagesEl.scrollHeight;
                    }
                    break;

                  case "error.occurred":
                    const errorEl = document.createElement("div");
                    errorEl.className = "message assistant";
                    errorEl.innerHTML = `<div class="message-content" style="background: #fee2e2; color: #991b1b;">⚠️ ${event.message}</div>`;
                    messagesEl.appendChild(errorEl);
                    break;
                }
              } catch (e) {
                // Ignore parse errors
              }
            }
          }
        } finally {
          document.getElementById("sendBtn").disabled = false;
          input.focus();
        }
      }

      document.getElementById("messageInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          sendMessage();
        }
      });

      function escapeHtml(text) {
        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };
        return text.replace(/[&<>"']/g, (m) => map[m]);
      }

      // Initialize
      initSession();
    </script>
  </body>
</html>
